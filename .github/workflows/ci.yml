name: ClearVoice CI

# Kích hoạt khi có commit push lên main hoặc khi có Pull Request vào main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Typecheck & Build Extension
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Node.js (v22) và cache npm để build nhanh hơn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Bước 3: Cài đặt dependencies sạch (dùng npm ci theo chuẩn CI/CD)
      - name: Install dependencies
        run: npm ci

      # Bước 4: Tải model đóng gói sẵn để test và build
      - name: Fetch Bundled Model
        run: npm run fetch-model

      # Bước 5: Chạy Unit Tests
      - name: Run Unit Tests
        run: npm test

      # Bước 6: Kiểm tra TypeScript & Build dự án Vite ra thư mục dist/
      - name: Typecheck & Build Chrome Extension
        run: npm run build

      # Bước 6: Lưu trữ thư mục dist/ thành Artifact để tải về dùng thử
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearvoice-extension-dist
          path: dist/
          retention-days: 7
