<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearVoice</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </div>
      <h1 class="title">ClearVoice</h1>
    </div>
    <span class="version">v0.4.0</span>
  </div>

  <div class="card">
    <div class="status-row">
      <div id="statusDot" class="status-dot idle"></div>
      <span id="statusText">Trạng thái: Sẵn sàng</span>
    </div>
    <div id="statusSubtext" class="status-subtext" style="display: none;"></div>
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
  </div>

  <div class="lang-row">
    <label for="langSelect" class="lang-label">Ngôn ngữ:</label>
    <select id="langSelect" class="lang-select">
      <option value="auto">Tự động nhận diện</option>
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Bắt đầu thu âm Tab
    </button>
    <button id="btnStop" class="btn btn-danger" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12"></rect>
      </svg>
      Dừng thu âm
    </button>
  </div>

  <div class="footer">
    Phụ đề hiển thị trực tiếp trên tab video
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
