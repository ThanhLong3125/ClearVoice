<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearVoice</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="header">
    <h1 class="title">ClearVoice</h1>
    <span class="version">v0.1.0 • Auto-Lang</span>
  </div>

  <div class="card">
    <div class="status-row">
      <div id="statusDot" class="status-dot idle"></div>
      <span id="statusText">Trạng thái: Sẵn sàng</span>
    </div>

    <div class="volume-container" id="volumeContainer" style="display: none;">
      <div class="volume-label">
        <span>Tín hiệu âm thanh:</span>
        <span id="volumePercent">0%</span>
      </div>
      <div class="volume-bar-bg">
        <div id="volumeBar" class="volume-bar-fill"></div>
      </div>

      <div class="pipeline-stats" id="pipelineStats" style="display: none;">
        <div class="stat-row">
          <span>AI Whisper (Tự nhận diện):</span>
          <strong id="statModel" style="color: #38bdf8;">Đang kết nối...</strong>
        </div>
        <div class="stat-row">
          <span>Tiếng nói (VAD):</span>
          <strong id="statVad" style="color: #94a3b8;">Chờ âm thanh...</strong>
        </div>
        <div class="stat-row">
          <span>Luồng xử lý (Queue):</span>
          <strong id="statQueue">0/5 (0 chunks)</strong>
        </div>
      </div>

      <div class="subtitle-card" id="subtitleCard" style="display: none;">
        <div class="subtitle-header">
          <span>Phụ đề trực tiếp (Live ASR)</span>
          <span class="live-dot"></span>
        </div>
        <div class="subtitle-text" id="popupSubtitle">Đang lắng nghe...</div>
      </div>
    </div>

    <div id="errorMsg" class="error-msg" style="display: none;"></div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Bắt đầu thu âm Tab
    </button>
    <button id="btnStop" class="btn btn-danger" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12"></rect>
      </svg>
      Dừng thu âm
    </button>
  </div>

  <div class="footer">
    Local-first AI Subtitles • Tự động nhận diện ngôn ngữ
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
